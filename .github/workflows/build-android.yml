name: Build Invictus APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee build-output.log
          echo "BUILD_OK=true" >> "$GITHUB_ENV"

      - name: Report build errors as annotations
        if: failure()
        shell: bash
        run: |
          # Extract error lines and emit as GitHub annotations (visible via API)
          ERRORS=$(grep -i 'e:.*error\|FAILURE\|Unresolved reference\|cannot find symbol\|Could not resolve' build-output.log | head -20 || true)
          TAIL=$(tail -30 build-output.log || true)
          echo "::error title=Build Errors::${ERRORS//$'\n'/%0A}"
          echo "::error title=Build Tail::${TAIL//$'\n'/%0A}"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Invictus-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
